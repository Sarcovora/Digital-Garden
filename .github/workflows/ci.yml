name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build tests (Quartz builds of the fixture vault)
        run: npm run test:build
      - name: Install WebKit for the iPhone tests
        run: npx playwright install --with-deps webkit
      - name: Browser tests (iPhone 14, WebKit)
        run: npm run test:e2e
      - name: Keep Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
